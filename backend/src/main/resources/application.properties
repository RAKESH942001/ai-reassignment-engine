# ─────────────────────────────────────────
# ZipRun AI Reassignment Engine
# ─────────────────────────────────────────

# ── Server ──
server.port=8080

# ── PostgreSQL ──
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ziprun_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# ── Seed data ──
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ── Routing ──
routing.strategy=rule-based

# ── LLM (OpenAI-compatible) ──
llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.cookie=${LLM_COOKIE:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.product=${LLM_PRODUCT:PCT}
llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:10}

# ── Async thread pool ──
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=replan-

# ── Actuator ──
management.endpoints.web.exposure.include=health,info
